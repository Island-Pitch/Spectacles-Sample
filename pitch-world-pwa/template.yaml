AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Pitch World PWA — Accessible AR experience platform by Island Pitch.
  Deploys static frontend to S3+CloudFront and API proxy Lambdas behind API Gateway.

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    MemorySize: 256
    Architectures: [arm64]
    Environment:
      Variables:
        NODE_ENV: production

Parameters:
  MeshyApiKey:
    Type: String
    NoEcho: true
    Description: Meshy.ai API key
  GeminiApiKey:
    Type: String
    NoEcho: true
    Description: Google Gemini API key
  OpenAIApiKey:
    Type: String
    NoEcho: true
    Description: OpenAI API key
  DomainName:
    Type: String
    Default: ""
    Description: Custom domain name (e.g., islandpitch.world). Leave empty for CloudFront default.
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate ARN for custom domain. Required if DomainName is set.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref DomainName, ""]]

Resources:
  # ============================================
  # S3 Bucket for Static Frontend
  # ============================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "pitch-world-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: 404.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # ============================================
  # CloudFront Distribution
  # ============================================
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: PitchWorldOAC
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Aliases: !If
          - HasCustomDomain
          - [!Ref DomainName]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: ApiOrigin
            DomainName: !Sub "${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  # ============================================
  # API Gateway
  # ============================================
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # ============================================
  # Lambda Functions — API Key Proxies
  # ============================================
  MeshyProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/meshy.handler
      CodeUri: src/lambda/
      Description: Proxies requests to Meshy.ai with server-side API key
      Environment:
        Variables:
          MESHY_API_KEY: !Ref MeshyApiKey
      Events:
        CreateTask:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/meshy/{proxy+}
            Method: ANY

  GeminiProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/gemini.handler
      CodeUri: src/lambda/
      Description: Proxies requests to Google Gemini with server-side API key
      Environment:
        Variables:
          GEMINI_API_KEY: !Ref GeminiApiKey
      Events:
        Generate:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/gemini/{proxy+}
            Method: ANY

  OpenAIProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/openai.handler
      CodeUri: src/lambda/
      Description: Proxies requests to OpenAI with server-side API key
      Environment:
        Variables:
          OPENAI_API_KEY: !Ref OpenAIApiKey
      Events:
        Generate:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/openai/{proxy+}
            Method: ANY

Outputs:
  CloudFrontURL:
    Description: CloudFront distribution URL
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"
  ApiURL:
    Description: API Gateway endpoint
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod"
  FrontendBucketName:
    Description: S3 bucket for static assets
    Value: !Ref FrontendBucket
  DistributionId:
    Description: CloudFront distribution ID (for cache invalidation)
    Value: !Ref CloudFrontDistribution
